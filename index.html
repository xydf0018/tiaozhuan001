<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>精选推荐</title>
  <style>
    body {
      font-family: "微软雅黑", sans-serif;
      padding: 30px;
      background-color: #fceef3;
      color: #333;
      text-align: center;
    }

    .link-box {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin: 20px auto;
      padding: 20px;
      width: 300px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
      border: none;
      background: #ff69b4;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #d9534f;
    }

    #stats {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 14px;
      color: #fff;
      background: #888;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    #info {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>今日推荐</h1>
  <div id="links"></div>

  <div id="message"></div>
  <div id="stats" onclick="showStats()">查看点击次数</div>
  <div id="info"></div>

  <script>
    const data = JSON.parse(localStorage.getItem('linkData')) || [];

    const container = document.getElementById("links");

    let clickCount = Number(localStorage.getItem("clickCount") || 0);

    data.forEach(item => {
      const box = document.createElement('div');
      box.className = 'link-box';
      box.innerHTML = `
        <div>${item.name}</div>
        <button onclick="copyAndNotify('${item.url}')">复制链接</button>
      `;
      container.appendChild(box);
    });

    function copyAndNotify(text) {
      navigator.clipboard.writeText(text).then(() => {
        clickCount++;
        localStorage.setItem("clickCount", clickCount);
        document.getElementById("message").innerText = "链接已复制，请打开浏览器粘贴访问！";
      });
    }

    function showStats() {
      let pwd = prompt("请输入密码查看详情：");
      if (pwd === "123456789aaa") {
        let msg = `点击次数：${clickCount}`;
        fetch('https://ipapi.co/json/')
          .then(res => res.json())
          .then(data => {
            msg += `\nIP地址：${data.ip}\n城市：${data.city}\n国家：${data.country_name}`;
            document.getElementById("info").innerText = msg;
          }).catch(() => {
            document.getElementById("info").innerText = msg + "\n无法获取IP定位信息";
          });
      } else {
        alert("密码错误！");
      }
    }
  </script>
</body>
</html>
