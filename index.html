<!DOCTYPE html> 
<html  lang ="zh-CN" >
<head >
  <meta  charset ="UTF-8"  />
  <meta  name ="viewport"  content ="width=device-width, initial-scale=1"  />
  <title >温馨跳转页 </title >
  <style >
    body  {
      font-family : "微软雅黑" , sans-serif ;
      padding : 30px ;
      background : linear-gradient (to  bottom  right , #ffe6ec, #fff0f5 );
      color : #333;
      text-align : center ;
    }

    h2  {
      color : #d6336c; 
      margin-bottom : 30px ;
      font-size : 24px ;
    }

    .link-box  {
      background : white ;
      border-radius : 12px ;
      box-shadow : 0 4px  12px  rgba (255, 105, 180, 0.2);
      margin : 25px  auto ;
      padding : 20px ;
      max-width : 90%;
    }

    .name  {
      font-size : 20px ;
      font-weight : bold ;
      margin-bottom : 15px ;
      color : #d6336c; 
    }

    button  {
      padding : 10px  24px ;
      font-size : 16px ;
      background-color: #ff69b4;
      color : white ;
      border: none;
      border-radius : 8px ;
      cursor: pointer;
    }

    button :hover {
      background-color: #e64997;
    }

    #counter {
      position: fixed;
      right : 10px ;
      bottom : 10px ;
      font-size : 12px ;
      background : rgba (0, 0, 0, 0.05);
      padding : 8px  12px ;
      border-radius : 8px ;
      cursor: pointer;
      color : #999;
    }

    .alert-box {
      margin-top: 40px ;
      font-size : 18px ;
      font-weight : bold ;
      color : #d62828;
      background : #fff3cd;
      border: 1px  solid #f5c2c7;
      padding : 15px ;
      border-radius : 10px ;
    }
  </style >
</head >
<body >
  <h2 >请选择要打开的链接</h2 >

  <div class="link-box">
    <div class="name">小金莲</div>
    <button  onclick="copyToClipboard('https://sisxhasas798.hebjiuhong.com/index?userId=251', 'xjl')">复制链接</button >
  </div>

  <div class="link-box">
    <div class="name">久伴</div>
    <button  onclick="copyToClipboard('https://static1.laiyifen.com/files/broadcast-grapher-app-api/image/9c7a5ad377324e328b81e06b1a0da36a.html?code=085608', 'jb')">复制链接</button >
  </div>

  <div class="alert-box">
    ⚠️ 重要提示：请务必将链接复制后粘贴到浏览器中打开，<br>微信/QQ中无法直接跳转！
  </div>

  <div id="counter" onclick="checkCount()">查看点击次数</div>

  <script>
    function copyToClipboard(link, key) {
      const input = document.createElement("input");
      input.setAttribute("value", link);
      document.body .appendChild(input);
      input.select();
      input.setSelectionRange(0, 99999);
      document.execCommand("copy");
      document.body .removeChild(input);
      alert("链接已复制，请粘贴到浏览器打开");

      // 点击计数
      let count = localStorage.getItem("count_" + key) || 0;
      count++;
      localStorage.setItem("count_" + key, count);
    }

    function checkCount() {
      const pwd = prompt("请输入密码查看点击数据：");
      if (pwd === "123456789aaa") {
        const xjl = localStorage.getItem("count_xjl") || 0;
        const jb = localStorage.getItem("count_jb") || 0;
        alert(`点击统计：\n小金莲：${xjl} 次\n久伴：${jb} 次`);
      } else {
        alert("密码错误，无法查看。");
      }
    }
  </script>
</body >
</html >
