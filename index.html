<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>温馨跳转页</title>
  <style>
    body {
      font-family: "微软雅黑", sans-serif;
      margin: 0;
      padding: 60px 20px 30px;
      background: linear-gradient(to right bottom, #ffe6f0, #fff0f5);
      background-image: radial-gradient(circle at top right, rgba(255,105,180,0.1), transparent 70%),
                        radial-gradient(circle at bottom left, rgba(255,182,193,0.1), transparent 70%);
      color: #333;
      text-align: center;
    }

    .marquee {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #ff69b4;
      color: white;
      font-weight: bold;
      font-size: 16px;
      padding: 10px 0;
      overflow: hidden;
      z-index: 9999;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      white-space: nowrap;
      animation: marquee 12s linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    h2 {
      color: #d6336c;
      margin-bottom: 30px;
      font-size: 24px;
    }

    .link-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.2);
      margin: 25px auto;
      padding: 20px;
      max-width: 90%;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #d6336c;
    }

    button {
      padding: 10px 24px;
      font-size: 16px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e64997;
    }

    #counter {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      color: #999;
      cursor: pointer;
    }

    .alert-box {
      margin-top: 40px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="marquee">
    <span>短信电话轰炸机，专门针对不服，需要的老板可以联系</span>
  </div>

  <h2>请选择要打开的链接</h2>

  <div class="link-box">
    <div class="name">小金莲</div>
    <button onclick="copyToClipboard('https://sisxhasas798.hebjiuhong.com/index?userId=251')">复制链接</button>
  </div>

  <div class="link-box">
    <div class="name">久伴</div>
    <button onclick="copyToClipboard('https://static1.laiyifen.com/files/broadcast-grapher-app-api/image/9c7a5ad377324e328b81e06b1a0da36a.html?code=085608')">复制链接</button>
  </div>

  <div class="alert-box">
    请长按链接 → 复制 → 粘贴到浏览器中打开！（微信/QQ/微博内直接打开将失败）
  </div>

  <div id="counter" onclick="showClickCount()">点击次数：查看</div>

  <script>
    function copyToClipboard(link) {
      navigator.clipboard.writeText(link).then(() => {
        alert("链接已复制，请粘贴到浏览器中打开！");
        let count = localStorage.getItem("clickCount") || 0;
        count++;
        localStorage.setItem("clickCount", count);
      });
    }

    function showClickCount() {
      const password = prompt("请输入密码查看点击次数：");
      if (password === "123456789aaa") {
        const count = localStorage.getItem("clickCount") || 0;
        alert("当前总点击次数为：" + count);
      } else if (password !== null) {
        alert("密码错误！");
      }
    }
  </script>
</body>
</html>
